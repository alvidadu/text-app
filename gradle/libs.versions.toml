[versions]
agp = "8.13.0"
core = "1.17.0"
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
glide = "4.16.0"
firebaseBom = "33.7.0"
lifecycle = "2.8.7"
swiperefresh = "1.1.0"
